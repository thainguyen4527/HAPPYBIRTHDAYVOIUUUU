<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-100: #fff0f5;
    --pink-200: #ffd6e7;
    --pink-300: #ffb3d1;
    --pink-400: #ff85b3;
    --pink-500: #f06292;
    --pink-600: #c2185b;
    --rose: #ff6b9d;
    --blush: #fce4ec;
    --cream: #fff9f5;
    --gold: #d4a0a0;
    --text-dark: #4a2040;
    --text-mid: #8b4c6e;
    --text-light: #c47fa0;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text-dark);
    cursor: default;
  }

  /* ===== SCREENS ===== */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s ease;
    overflow: hidden;
  }
  .screen.active { opacity: 1; pointer-events: all; }
  .screen.exit { opacity: 0; pointer-events: none; }

  /* ===== ANIMATED BG ===== */
  .bg-layer {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 20%, #ffe0ec 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, #ffd6f0 0%, transparent 55%),
      radial-gradient(ellipse at 60% 10%, #fff0f5 0%, transparent 50%),
      #fff9f8;
  }

  /* floating petals bg */
  .petals-bg { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .petal {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50% 0 50% 0;
    opacity: 0.35;
    animation: floatPetal linear infinite;
  }
  @keyframes floatPetal {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.4; }
    90%  { opacity: 0.35; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== SCREEN 1 — CELEBRATION ===== */
  #s1 { background: transparent; }
  #s1 .bg-layer {
    background:
      radial-gradient(ellipse at 30% 30%, #ffd6e7 0%, transparent 60%),
      radial-gradient(ellipse at 70% 70%, #ffcce0 0%, transparent 60%),
      #fff0f5;
  }

  .confetti-canvas { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

  .s1-content { position: relative; z-index: 10; text-align: center; }

  .balloons { display: flex; gap: 20px; margin-bottom: 20px; justify-content: center; }
  .balloon {
    font-size: 48px;
    animation: floatBalloon 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 8px rgba(200,80,120,0.2));
  }
  .balloon:nth-child(2) { animation-delay: 0.4s; }
  .balloon:nth-child(3) { animation-delay: 0.8s; }
  @keyframes floatBalloon {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }

  .hb-title {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(52px, 12vw, 96px);
    color: var(--pink-500);
    line-height: 1;
    text-shadow: 0 2px 20px rgba(240,98,146,0.3);
    animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    animation-delay: 0.3s;
  }
  .hb-sub {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 28px);
    color: var(--text-mid);
    font-style: italic;
    margin-top: 8px;
    animation: fadeSlide 0.8s ease both;
    animation-delay: 0.8s;
  }
  .hb-name {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(32px, 7vw, 56px);
    color: var(--rose);
    margin-top: 4px;
    animation: fadeSlide 0.8s ease both;
    animation-delay: 1.1s;
  }

  .hearts-row {
    display: flex; gap: 8px; justify-content: center;
    margin: 16px 0;
    animation: fadeSlide 0.8s ease both;
    animation-delay: 1.4s;
  }
  .hrt { font-size: 22px; animation: pulse 1.5s ease-in-out infinite; }
  .hrt:nth-child(2) { animation-delay: 0.2s; font-size: 28px; }
  .hrt:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }

  .btn-next {
    margin-top: 28px;
    background: linear-gradient(135deg, var(--rose), var(--pink-500));
    color: white;
    border: none;
    padding: 14px 42px;
    border-radius: 50px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(240,98,146,0.4);
    animation: fadeSlide 0.8s ease both;
    animation-delay: 1.7s;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(240,98,146,0.5); }
  .btn-next:active { transform: scale(0.97); }

  @keyframes popIn {
    from { transform: scale(0.4) rotate(-8deg); opacity: 0; }
    to { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes fadeSlide {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ===== SCREEN 2 — PHOTOS ===== */
  #s2 .bg-layer {
    background:
      radial-gradient(ellipse at 15% 50%, #ffe0ec 0%, transparent 50%),
      radial-gradient(ellipse at 85% 50%, #ffd6f0 0%, transparent 50%),
      #fff5f8;
  }

  .gallery-wrapper {
    position: relative; z-index: 10;
    width: 100%; max-width: 700px;
    padding: 0 20px;
    text-align: center;
  }

  .gallery-top-text {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(22px, 5vw, 38px);
    color: var(--pink-500);
    margin-bottom: 16px;
    animation: fadeSlide 0.6s ease both;
  }

  .slideshow-frame {
    position: relative;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  /* decorative corner flowers */
  .slideshow-frame::before, .slideshow-frame::after {
    content: '🌸';
    position: absolute;
    font-size: 28px;
    z-index: 20;
  }
  .slideshow-frame::before { top: -14px; left: -14px; }
  .slideshow-frame::after  { bottom: -14px; right: -14px; }

  .photo-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    border-radius: 20px;
    overflow: hidden;
    border: 6px solid white;
    box-shadow:
      0 0 0 2px var(--pink-200),
      0 12px 48px rgba(200,80,120,0.25),
      0 4px 12px rgba(200,80,120,0.15);
  }

  .photo-slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.8s ease, transform 0.8s ease;
    transform: scale(1.04);
  }
  .photo-slide.active { opacity: 1; transform: scale(1); }
  .photo-slide.prev   { opacity: 0; transform: scale(0.96); }

  .photo-slide img {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* placeholder when no image */
  .photo-placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, var(--pink-100), var(--pink-200));
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    color: var(--text-light);
  }
  .photo-placeholder .ph-icon { font-size: 56px; }
  .photo-placeholder .ph-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--text-light);
  }
  .photo-placeholder .ph-num {
    font-family: 'Dancing Script', cursive;
    font-size: 28px;
    color: var(--pink-400);
  }

  /* sparkle overlay on photo */
  .sparkle-overlay {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 80%, rgba(255,200,210,0.12) 0%, transparent 40%);
  }

  /* caption ribbon */
  .photo-caption {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    background: linear-gradient(to top, rgba(200,80,120,0.65), transparent);
    padding: 20px 14px 10px;
    font-family: 'Dancing Script', cursive;
    font-size: 17px;
    color: white;
    text-align: center;
    opacity: 0;
    transition: opacity 0.4s ease 0.5s;
  }
  .photo-slide.active .photo-caption { opacity: 1; }

  /* nav dots */
  .dot-nav {
    display: flex; gap: 8px; justify-content: center; margin: 14px 0;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--pink-200);
    transition: all 0.3s;
    cursor: pointer;
  }
  .dot.active { background: var(--rose); transform: scale(1.4); }

  /* prev/next arrows */
  .arrow-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.85);
    border: 1.5px solid var(--pink-200);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 20;
    font-size: 16px; color: var(--pink-500);
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }
  .arrow-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }
  .arrow-btn.prev-btn { left: -18px; }
  .arrow-btn.next-btn { right: -18px; }

  /* photo count */
  .photo-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  /* upload area */
  .upload-area {
    border: 2px dashed var(--pink-300);
    border-radius: 16px;
    padding: 12px 20px;
    margin-top: 14px;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(4px);
  }
  .upload-area:hover { border-color: var(--rose); background: rgba(255,240,245,0.9); }
  .upload-area input { display: none; }
  .upload-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--text-light);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .btn-to-letter {
    margin-top: 14px;
    background: linear-gradient(135deg, var(--rose), var(--pink-500));
    color: white;
    border: none;
    padding: 13px 38px;
    border-radius: 50px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(240,98,146,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 0.5px;
  }
  .btn-to-letter:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(240,98,146,0.5); }

  /* ===== SCREEN 3 — LETTER ===== */
  #s3 .bg-layer {
    background:
      radial-gradient(ellipse at 50% 0%, #ffd6e7 0%, transparent 60%),
      radial-gradient(ellipse at 20% 100%, #ffe0f0 0%, transparent 50%),
      #fff8fb;
  }

  .letter-wrapper {
    position: relative; z-index: 10;
    width: 90%; max-width: 640px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(255,182,210,0.5);
    border-radius: 28px;
    padding: clamp(28px, 5vw, 52px) clamp(24px, 5vw, 48px);
    box-shadow:
      0 20px 60px rgba(200,80,120,0.12),
      0 4px 16px rgba(200,80,120,0.08),
      inset 0 1px 0 rgba(255,255,255,0.9);
    max-height: 90vh;
    overflow-y: auto;
  }

  .letter-deco-top {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
    letter-spacing: 6px;
  }

  .letter-salutation {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(22px, 4vw, 32px);
    color: var(--rose);
    margin-bottom: 18px;
  }

  .letter-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(17px, 2.5vw, 22px);
    line-height: 1.85;
    color: var(--text-dark);
    min-height: 120px;
    position: relative;
  }

  .cursor-blink {
    display: inline-block;
    width: 2px; height: 1.1em;
    background: var(--rose);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .letter-sign {
    margin-top: 28px;
    text-align: right;
    font-family: 'Dancing Script', cursive;
    font-size: clamp(20px, 3vw, 28px);
    color: var(--pink-500);
    opacity: 0;
    transition: opacity 1s ease;
  }
  .letter-sign.visible { opacity: 1; }

  .letter-deco-bottom {
    text-align: center;
    margin-top: 20px;
    font-size: 22px;
    letter-spacing: 5px;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .letter-deco-bottom.visible { opacity: 1; }

  .replay-btn {
    display: block;
    margin: 20px auto 0;
    background: transparent;
    border: 1.5px solid var(--pink-300);
    color: var(--text-mid);
    padding: 10px 30px;
    border-radius: 50px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    opacity: 0;
  }
  .replay-btn.visible { opacity: 1; transition: opacity 1s ease 0.5s, background 0.2s, color 0.2s; }
  .replay-btn:hover { background: var(--pink-100); color: var(--rose); border-color: var(--rose); }

  /* floating hearts screen 3 */
  .heart-float {
    position: fixed; pointer-events: none; z-index: 5;
    font-size: 20px;
    animation: floatHeart 4s ease-in forwards;
    opacity: 0;
  }
  @keyframes floatHeart {
    0%  { transform: translateY(0) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 0.8; }
    100%{ transform: translateY(-60vh) scale(1.2) rotate(15deg); opacity: 0; }
  }

  /* scrollbar for letter */
  .letter-wrapper::-webkit-scrollbar { width: 4px; }
  .letter-wrapper::-webkit-scrollbar-track { background: transparent; }
  .letter-wrapper::-webkit-scrollbar-thumb { background: var(--pink-200); border-radius: 2px; }
</style>
</head>
<body>

<!-- SCREEN 1: CELEBRATION -->
<div id="s1" class="screen active">
  <div class="bg-layer"></div>
  <div class="petals-bg" id="petals1"></div>
  <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

  <div class="s1-content">
    <div class="balloons">
      <span class="balloon">🎈</span>
      <span class="balloon">🎀</span>
      <span class="balloon">🎈</span>
    </div>
    <div class="hb-title">Happy Birthday</div>
    <div class="hb-sub">gửi đến người mà anh yêu nhất</div>
    <div class="hb-name">Vợ yêu của anh 💕</div>
    <div class="hearts-row">
      <span class="hrt">🌸</span>
      <span class="hrt">💗</span>
      <span class="hrt">🌸</span>
    </div>
    <button class="btn-next" onclick="goToScreen(2)">Xem điều anh muốn nói &nbsp;→</button>
  </div>
</div>

<!-- SCREEN 2: PHOTOS -->
<div id="s2" class="screen">
  <div class="bg-layer"></div>
  <div class="petals-bg" id="petals2"></div>

  <div class="gallery-wrapper">
    <div class="gallery-top-text">Những khoảnh khắc của chúng ta 🌷</div>

    <div class="slideshow-frame">
      <div class="photo-stage" id="photoStage">
        <!-- slides will be inserted by JS -->
      </div>
      <button class="arrow-btn prev-btn" onclick="changeSlide(-1)">‹</button>
      <button class="arrow-btn next-btn" onclick="changeSlide(1)">›</button>
    </div>

    <div class="photo-count" id="photoCount">1 / 1</div>
    <div class="dot-nav" id="dotNav"></div>

    <label class="upload-area">
      <input type="file" accept="image/*" multiple id="photoUpload" onchange="handlePhotos(this)">
      <span class="upload-label">
        <span>🌸</span>
        <span>Thêm ảnh của hai đứa mình</span>
        <span>🌸</span>
      </span>
    </label>

    <button class="btn-to-letter" onclick="goToScreen(3)">Đọc lời anh muốn nói &nbsp;💌</button>
  </div>
</div>

<!-- SCREEN 3: LETTER -->
<div id="s3" class="screen">
  <div class="bg-layer"></div>
  <div class="petals-bg" id="petals3"></div>

  <div class="letter-wrapper">
    <div class="letter-deco-top">🌸 💗 🌸</div>
    <div class="letter-salutation">Em yêu của anh,</div>
    <div class="letter-body" id="letterBody"><span class="cursor-blink" id="typeCursor"></span></div>
    <div class="letter-sign" id="letterSign">— Với tất cả tình yêu của anh 💗</div>
    <div class="letter-deco-bottom" id="letterDeco">🌸 &nbsp; 💕 &nbsp; 🌸</div>
    <button class="replay-btn" id="replayBtn" onclick="replayAll()">↺ &nbsp; Xem lại từ đầu</button>
  </div>
</div>

<script>
// ===== CONFETTI =====
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
let confetti = [];
let animFrame;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const colors = ['#ff85b3','#ffb3d1','#ffd6e7','#ff6b9d','#f06292','#ffc4de','#e91e8c','#fff0f5','#ff94c2'];

function spawnConfetti() {
  for (let i = 0; i < 6; i++) {
    confetti.push({
      x: Math.random() * canvas.width,
      y: -10,
      r: Math.random() * 7 + 3,
      d: Math.random() * 10 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10 - 5,
      tiltAngle: 0,
      tiltSpeed: Math.random() * 0.1 + 0.05,
      vx: Math.random() * 2 - 1,
      vy: Math.random() * 3 + 1.5,
      shape: Math.random() > 0.5 ? 'circle' : 'rect',
      opacity: Math.random() * 0.5 + 0.5
    });
  }
}

function drawConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confetti.forEach(c => {
    ctx.globalAlpha = c.opacity;
    ctx.fillStyle = c.color;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.tiltAngle);
    if (c.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-c.r, -c.r / 2, c.r * 2, c.r);
    }
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function updateConfetti() {
  confetti = confetti.filter(c => c.y < canvas.height + 20);
  confetti.forEach(c => {
    c.x += c.vx + Math.sin(c.d) * 0.5;
    c.y += c.vy;
    c.tiltAngle += c.tiltSpeed;
    c.d += 0.1;
  });
}

let confettiSpawnInterval;
function startConfetti() {
  spawnConfetti();
  spawnConfetti();
  spawnConfetti();
  confettiSpawnInterval = setInterval(spawnConfetti, 180);
  function loop() {
    animFrame = requestAnimationFrame(loop);
    updateConfetti();
    drawConfetti();
  }
  loop();
}

function stopConfetti() {
  clearInterval(confettiSpawnInterval);
  setTimeout(() => {
    cancelAnimationFrame(animFrame);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }, 2500);
}

// ===== PETALS =====
function createPetals(containerId) {
  const container = document.getElementById(containerId);
  const petalColors = ['#ffb3d1','#ffd6e7','#ff85b3','#ffc4de','#fff0f5','#f48fb1'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = '-20px';
    p.style.background = petalColors[Math.floor(Math.random() * petalColors.length)];
    p.style.width = (Math.random() * 10 + 6) + 'px';
    p.style.height = (Math.random() * 10 + 6) + 'px';
    p.style.animationDuration = (Math.random() * 10 + 10) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    container.appendChild(p);
  }
}
createPetals('petals1');
createPetals('petals2');
createPetals('petals3');

// ===== PHOTOS =====
const captions = [
  'Mỗi khoảnh khắc bên em đều trở thành ký ức anh trân trọng 🌸',
  'Nụ cười của em là điều anh yêu nhất trên đời 💕',
  'Cảm ơn em đã xuất hiện trong cuộc đời anh 🌹',
  'Hai đứa mình — mãi mãi 💗',
  'Em là nhà của anh 🏡',
  'Bên em, mọi thứ đều trở nên đẹp hơn ✨',
  'Hạnh phúc chính là đây 💖',
];

let photos = [];
let currentSlide = 0;

function initPlaceholders() {
  const stage = document.getElementById('photoStage');
  stage.innerHTML = '';
  const slide = createSlide(null, 0);
  stage.appendChild(slide);
  slide.classList.add('active');
  updateNav(1, 1);
}

function createSlide(src, idx) {
  const div = document.createElement('div');
  div.className = 'photo-slide';
  div.dataset.idx = idx;

  if (src) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Ảnh kỷ niệm';
    div.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'photo-placeholder';
    ph.innerHTML = `
      <div class="ph-icon">📸</div>
      <div class="ph-num">Ảnh của hai đứa</div>
      <div class="ph-label">Bấm bên dưới để thêm ảnh nhé 🌸</div>
    `;
    div.appendChild(ph);
  }

  const ov = document.createElement('div');
  ov.className = 'sparkle-overlay';
  div.appendChild(ov);

  const cap = document.createElement('div');
  cap.className = 'photo-caption';
  cap.textContent = captions[idx % captions.length];
  div.appendChild(cap);

  return div;
}

function handlePhotos(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  photos = [];
  const stage = document.getElementById('photoStage');
  stage.innerHTML = '';

  let loaded = 0;
  const readers = files.map((file, i) => {
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => { photos[i] = e.target.result; loaded++; resolve(); };
      r.readAsDataURL(file);
    });
  });

  Promise.all(readers).then(() => {
    photos.forEach((src, i) => {
      const slide = createSlide(src, i);
      stage.appendChild(slide);
    });
    currentSlide = 0;
    document.querySelectorAll('.photo-slide')[0]?.classList.add('active');
    updateNav(1, photos.length);
  });
}

function changeSlide(dir) {
  const slides = document.querySelectorAll('.photo-slide');
  if (slides.length <= 1) return;

  const prev = slides[currentSlide];
  prev.classList.remove('active');
  prev.classList.add('prev');
  setTimeout(() => prev.classList.remove('prev'), 900);

  currentSlide = (currentSlide + dir + slides.length) % slides.length;
  slides[currentSlide].classList.add('active');
  updateNav(currentSlide + 1, slides.length);

  // sparkle effect on slide change
  spawnHeartBurst();
}

function updateNav(cur, total) {
  document.getElementById('photoCount').textContent = cur + ' / ' + total;
  const dotNav = document.getElementById('dotNav');
  dotNav.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === cur - 1 ? ' active' : '');
    d.onclick = (function(idx){ return function(){ gotoSlide(idx); }; })(i);
    dotNav.appendChild(d);
  }
}

function gotoSlide(idx) {
  const slides = document.querySelectorAll('.photo-slide');
  if (idx === currentSlide) return;
  const dir = idx > currentSlide ? 1 : -1;
  const prev = slides[currentSlide];
  prev.classList.remove('active');
  prev.classList.add('prev');
  setTimeout(() => prev.classList.remove('prev'), 900);
  currentSlide = idx;
  slides[currentSlide].classList.add('active');
  updateNav(currentSlide + 1, slides.length);
}

// auto slide
let autoSlideTimer;
function startAutoSlide() {
  autoSlideTimer = setInterval(() => changeSlide(1), 4000);
}
function stopAutoSlide() { clearInterval(autoSlideTimer); }

document.getElementById('photoStage').addEventListener('mouseenter', stopAutoSlide);
document.getElementById('photoStage').addEventListener('mouseleave', startAutoSlide);

initPlaceholders();

// ===== TYPEWRITER =====
const message = `Một năm nữa được đón sinh nhật cùng em...

Hai năm thôi — nhưng trong hai năm đó, biết bao nhiêu điều đã thay đổi trong cuộc sống của chúng ta. Có những khoảnh khắc khó khăn, những lúc chông chênh, những lần cả hai cùng vấp ngã.

Nhưng với anh, điều may mắn nhất — là dù bao nhiêu thứ thay đổi, vẫn còn đó một điều không hề dịch chuyển: sự hiện diện của em trong cuộc đời anh, và của anh trong cuộc đời em.

Cảm ơn em vì những lần tha thứ khi anh chưa xứng đáng. Cảm ơn vì những lần nhường nhịn mà em không bao giờ kể lại. Cảm ơn vì đã ở lại — và tiếp tục ở lại.

Em không cần phải hoàn hảo. Anh cũng không. Nhưng khi có nhau, chúng ta đủ rồi.

Sinh nhật em, anh chỉ ước một điều thôi — rằng mỗi năm tiếp theo, anh sẽ là người được đứng cạnh em, được chứng kiến em lớn lên, được yêu em nhiều hơn ngày hôm qua.

Yêu em, hôm nay và mãi mãi. 💗`;

let typeIdx = 0;
let typeTimer;
let isTyping = false;

function startTypewriter() {
  if (isTyping) return;
  isTyping = true;
  const body = document.getElementById('letterBody');
  const cursor = document.getElementById('typeCursor');
  body.innerHTML = '';
  body.appendChild(cursor);
  typeIdx = 0;
  spawnFloatingHearts();

  typeTimer = setInterval(() => {
    if (typeIdx >= message.length) {
      clearInterval(typeTimer);
      cursor.remove();
      document.getElementById('letterSign').classList.add('visible');
      document.getElementById('letterDeco').classList.add('visible');
      document.getElementById('replayBtn').classList.add('visible');
      return;
    }
    const ch = message[typeIdx];
    if (ch === '\n') {
      body.insertBefore(document.createElement('br'), cursor);
      if (message[typeIdx + 1] === '\n') {
        body.insertBefore(document.createElement('br'), cursor);
        typeIdx++;
      }
    } else {
      const span = document.createElement('span');
      span.textContent = ch;
      body.insertBefore(span, cursor);
    }
    typeIdx++;
  }, 28);
}

// ===== FLOATING HEARTS =====
function spawnHeartBurst() {
  const emojis = ['💗','🌸','💕','🌷','💖'];
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = (Math.random() * 80 + 10) + '%';
      h.style.bottom = '10%';
      h.style.animationDuration = (Math.random() * 2 + 3) + 's';
      h.style.fontSize = (Math.random() * 14 + 14) + 'px';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 5000);
    }, i * 200);
  }
}

function spawnFloatingHearts() {
  const interval = setInterval(spawnHeartBurst, 3000);
  setTimeout(() => clearInterval(interval), 25000);
}

// ===== SCREEN TRANSITIONS =====
function goToScreen(n) {
  const all = document.querySelectorAll('.screen');
  all.forEach(s => { s.classList.remove('active', 'exit'); });

  const target = document.getElementById('s' + n);

  if (n === 1) {
    target.classList.add('active');
    startConfetti();
    setTimeout(stopConfetti, 6000);
  } else if (n === 2) {
    stopConfetti();
    target.classList.add('active');
    setTimeout(startAutoSlide, 800);
  } else if (n === 3) {
    stopAutoSlide();
    target.classList.add('active');
    isTyping = false;
    document.getElementById('letterSign').classList.remove('visible');
    document.getElementById('letterDeco').classList.remove('visible');
    document.getElementById('replayBtn').classList.remove('visible');
    setTimeout(startTypewriter, 600);
  }
}

function replayAll() {
  goToScreen(1);
  stopConfetti();
  setTimeout(() => { startConfetti(); }, 100);
  setTimeout(stopConfetti, 6000);
}

// ===== INIT =====
startConfetti();
setTimeout(stopConfetti, 7000);
