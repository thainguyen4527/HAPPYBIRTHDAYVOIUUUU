<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Vợ Yêu 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --pink-100:#fff0f5;--pink-200:#ffd6e7;--pink-300:#ffb3d1;
    --pink-400:#ff85b3;--pink-500:#f06292;--rose:#ff6b9d;
    --blush:#fce4ec;--cream:#fff9f5;--text-dark:#4a2040;
    --text-mid:#8b4c6e;--text-light:#c47fa0;
  }
  html,body{width:100%;height:100%;overflow:hidden;background:var(--cream);
    font-family:'Cormorant Garamond',serif;color:var(--text-dark);cursor:default}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;opacity:0;pointer-events:none;
    transition:opacity 0.9s ease;overflow:hidden}
  .screen.active{opacity:1;pointer-events:all}
  .bg-layer{position:absolute;inset:0;z-index:0}
  #s1 .bg-layer{background:radial-gradient(ellipse at 30% 30%,#ffd6e7 0%,transparent 60%),
    radial-gradient(ellipse at 70% 70%,#ffcce0 0%,transparent 60%),#fff0f5}
  #s2 .bg-layer{background:radial-gradient(ellipse at 15% 50%,#ffe0ec 0%,transparent 50%),
    radial-gradient(ellipse at 85% 50%,#ffd6f0 0%,transparent 50%),#fff5f8}
  #s3 .bg-layer{background:radial-gradient(ellipse at 50% 0%,#ffd6e7 0%,transparent 60%),
    radial-gradient(ellipse at 20% 100%,#ffe0f0 0%,transparent 50%),#fff8fb}

  /* PETALS */
  .petals-bg{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
  .petal{position:absolute;border-radius:50% 0 50% 0;opacity:.35;animation:floatPetal linear infinite}
  @keyframes floatPetal{
    0%{transform:translateY(-20px) rotate(0deg);opacity:0}
    10%{opacity:.4} 90%{opacity:.35}
    100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

  /* CONFETTI */
  .confetti-canvas{position:absolute;inset:0;z-index:2;pointer-events:none}

  /* SCREEN 1 */
  .s1-content{position:relative;z-index:10;text-align:center;padding:0 20px}
  .balloons{display:flex;gap:20px;margin-bottom:20px;justify-content:center}
  .balloon{font-size:48px;animation:floatBalloon 3s ease-in-out infinite;
    filter:drop-shadow(0 4px 8px rgba(200,80,120,.2))}
  .balloon:nth-child(2){animation-delay:.4s}
  .balloon:nth-child(3){animation-delay:.8s}
  @keyframes floatBalloon{
    0%,100%{transform:translateY(0) rotate(-3deg)}
    50%{transform:translateY(-14px) rotate(3deg)}}
  .hb-title{font-family:'Dancing Script',cursive;font-size:clamp(52px,12vw,96px);
    color:var(--pink-500);line-height:1;text-shadow:0 2px 20px rgba(240,98,146,.3);
    animation:popIn .8s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.3s}
  .hb-sub{font-family:'Playfair Display',serif;font-size:clamp(16px,3.5vw,26px);
    color:var(--text-mid);font-style:italic;margin-top:8px;
    animation:fadeSlide .8s ease both;animation-delay:.8s}
  .hb-name{font-family:'Dancing Script',cursive;font-size:clamp(28px,6vw,52px);
    color:var(--rose);margin-top:4px;animation:fadeSlide .8s ease both;animation-delay:1.1s}
  .hearts-row{display:flex;gap:8px;justify-content:center;margin:16px 0;
    animation:fadeSlide .8s ease both;animation-delay:1.4s}
  .hrt{font-size:22px;animation:pulse 1.5s ease-in-out infinite}
  .hrt:nth-child(2){animation-delay:.2s;font-size:28px}
  .hrt:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .btn-next{margin-top:28px;background:linear-gradient(135deg,var(--rose),var(--pink-500));
    color:white;border:none;padding:14px 42px;border-radius:50px;
    font-family:'Cormorant Garamond',serif;font-size:18px;letter-spacing:1px;cursor:pointer;
    box-shadow:0 6px 24px rgba(240,98,146,.4);
    animation:fadeSlide .8s ease both;animation-delay:1.7s;
    transition:transform .2s,box-shadow .2s}
  .btn-next:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(240,98,146,.5)}
  @keyframes popIn{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes fadeSlide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

  /* SCREEN 2 */
  .gallery-wrapper{position:relative;z-index:10;width:100%;max-width:520px;
    padding:0 20px;text-align:center}
  .gallery-top-text{font-family:'Dancing Script',cursive;font-size:clamp(20px,4.5vw,34px);
    color:var(--pink-500);margin-bottom:14px}
  .slideshow-frame{position:relative;width:100%;max-width:420px;margin:0 auto}
  .slideshow-frame::before,.slideshow-frame::after{content:'🌸';position:absolute;
    font-size:26px;z-index:20}
  .slideshow-frame::before{top:-13px;left:-13px}
  .slideshow-frame::after{bottom:-13px;right:-13px}
  .photo-stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:20px;
    overflow:hidden;border:6px solid white;
    box-shadow:0 0 0 2px var(--pink-200),0 12px 48px rgba(200,80,120,.25)}
  .photo-slide{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;opacity:0;transition:opacity .8s ease,transform .8s ease;
    transform:scale(1.04)}
  .photo-slide.active{opacity:1;transform:scale(1)}
  .photo-slide.prev{opacity:0;transform:scale(.96)}
  .photo-slide img{width:100%;height:100%;object-fit:cover}
  .sparkle-overlay{position:absolute;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(ellipse at 20% 20%,rgba(255,255,255,.15) 0%,transparent 40%),
    radial-gradient(ellipse at 80% 80%,rgba(255,200,210,.12) 0%,transparent 40%)}
  .photo-caption{position:absolute;bottom:0;left:0;right:0;z-index:10;
    background:linear-gradient(to top,rgba(200,80,120,.65),transparent);
    padding:24px 14px 12px;font-family:'Dancing Script',cursive;font-size:16px;
    color:white;text-align:center;opacity:0;transition:opacity .4s ease .5s}
  .photo-slide.active .photo-caption{opacity:1}
  .dot-nav{display:flex;gap:8px;justify-content:center;margin:12px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--pink-200);
    transition:all .3s;cursor:pointer}
  .dot.active{background:var(--rose);transform:scale(1.4)}
  .arrow-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;
    background:rgba(255,255,255,.85);border:1.5px solid var(--pink-200);border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;
    font-size:16px;color:var(--pink-500);transition:all .2s;backdrop-filter:blur(4px)}
  .arrow-btn:hover{background:white;transform:translateY(-50%) scale(1.1)}
  .arrow-btn.prev-btn{left:-18px}
  .arrow-btn.next-btn{right:-18px}
  .photo-count{font-family:'Cormorant Garamond',serif;font-size:13px;
    color:var(--text-light);margin-bottom:6px;letter-spacing:1px}
  .upload-area{border:2px dashed var(--pink-300);border-radius:14px;padding:10px 18px;
    margin-top:12px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.6);
    backdrop-filter:blur(4px)}
  .upload-area:hover{border-color:var(--rose);background:rgba(255,240,245,.9)}
  .upload-area input{display:none}
  .upload-label{font-family:'Cormorant Garamond',serif;font-size:14px;
    color:var(--text-light);cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .btn-to-letter{margin-top:12px;background:linear-gradient(135deg,var(--rose),var(--pink-500));
    color:white;border:none;padding:13px 36px;border-radius:50px;
    font-family:'Cormorant Garamond',serif;font-size:17px;cursor:pointer;
    box-shadow:0 6px 24px rgba(240,98,146,.35);transition:transform .2s,box-shadow .2s;
    letter-spacing:.5px}
  .btn-to-letter:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(240,98,146,.5)}

  /* SCREEN 3 */
  .letter-wrapper{position:relative;z-index:10;width:90%;max-width:640px;
    background:rgba(255,255,255,.75);backdrop-filter:blur(12px);
    border:1.5px solid rgba(255,182,210,.5);border-radius:28px;
    padding:clamp(24px,5vw,48px) clamp(20px,5vw,44px);
    box-shadow:0 20px 60px rgba(200,80,120,.12),0 4px 16px rgba(200,80,120,.08),
    inset 0 1px 0 rgba(255,255,255,.9);max-height:90vh;overflow-y:auto}
  .letter-wrapper::-webkit-scrollbar{width:4px}
  .letter-wrapper::-webkit-scrollbar-thumb{background:var(--pink-200);border-radius:2px}
  .letter-deco-top{text-align:center;font-size:26px;margin-bottom:18px;letter-spacing:6px}
  .letter-salutation{font-family:'Dancing Script',cursive;
    font-size:clamp(20px,4vw,30px);color:var(--rose);margin-bottom:16px}
  .letter-body{font-family:'Cormorant Garamond',serif;font-size:clamp(16px,2.3vw,21px);
    line-height:1.9;color:var(--text-dark);min-height:100px;position:relative}
  .cursor-blink{display:inline-block;width:2px;height:1.1em;background:var(--rose);
    margin-left:2px;vertical-align:text-bottom;animation:blink .8s step-end infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .letter-sign{margin-top:26px;text-align:right;font-family:'Dancing Script',cursive;
    font-size:clamp(18px,3vw,26px);color:var(--pink-500);opacity:0;transition:opacity 1s ease}
  .letter-sign.visible{opacity:1}
  .letter-deco-bottom{text-align:center;margin-top:18px;font-size:20px;letter-spacing:5px;
    opacity:0;transition:opacity 1s ease}
  .letter-deco-bottom.visible{opacity:1}
  .replay-btn{display:block;margin:18px auto 0;background:transparent;
    border:1.5px solid var(--pink-300);color:var(--text-mid);padding:10px 28px;
    border-radius:50px;font-family:'Cormorant Garamond',serif;font-size:15px;
    cursor:pointer;letter-spacing:.5px;opacity:0}
  .replay-btn.visible{opacity:1;transition:opacity 1s ease .5s,background .2s,color .2s}
  .replay-btn:hover{background:var(--pink-100);color:var(--rose);border-color:var(--rose)}
  .heart-float{position:fixed;pointer-events:none;z-index:5;font-size:20px;
    animation:floatHeart 4s ease-in forwards;opacity:0}
  @keyframes floatHeart{
    0%{transform:translateY(0) scale(.5);opacity:0}
    20%{opacity:1} 80%{opacity:.8}
    100%{transform:translateY(-60vh) scale(1.2) rotate(15deg);opacity:0}}
</style>
</head>
<body>

<!-- S1 CELEBRATION -->
<div id="s1" class="screen active">
  <div class="bg-layer"></div>
  <div class="petals-bg" id="petals1"></div>
  <canvas class="confetti-canvas" id="confettiCanvas"></canvas>
  <div class="s1-content">
    <div class="balloons">
      <span class="balloon">🎈</span>
      <span class="balloon">🎀</span>
      <span class="balloon">🎈</span>
    </div>
    <div class="hb-title">Happy Birthday</div>
    <div class="hb-sub">gửi đến người mà anh yêu nhất</div>
    <div class="hb-name">Vợ yêu của anh 💕</div>
    <div class="hearts-row">
      <span class="hrt">🌸</span><span class="hrt">💗</span><span class="hrt">🌸</span>
    </div>
    <button class="btn-next" onclick="goToScreen(2)">Xem điều anh muốn nói &nbsp;→</button>
  </div>
</div>

<!-- S2 PHOTOS -->
<div id="s2" class="screen">
  <div class="bg-layer"></div>
  <div class="petals-bg" id="petals2"></div>
  <div class="gallery-wrapper">
    <div class="gallery-top-text">Những khoảnh khắc của chúng ta 🌷</div>
    <div class="slideshow-frame">
      <div class="photo-stage" id="photoStage"></div>
      <button class="arrow-btn prev-btn" onclick="changeSlide(-1)">‹</button>
      <button class="arrow-btn next-btn" onclick="changeSlide(1)">›</button>
    </div>
    <div class="photo-count" id="photoCount">1 / 1</div>
    <div class="dot-nav" id="dotNav"></div>
    <label class="upload-area">
      <input type="file" accept="image/*" multiple id="photoUpload" onchange="handlePhotos(this)">
      <span class="upload-label"><span>🌸</span><span>Thêm thêm ảnh của hai đứa</span><span>🌸</span></span>
    </label>
    <button class="btn-to-letter" onclick="goToScreen(3)">Đọc lời anh muốn nói &nbsp;💌</button>
  </div>
</div>

<!-- S3 LETTER -->
<div id="s3" class="screen">
  <div class="bg-layer"></div>
  <div class="petals-bg" id="petals3"></div>
  <div class="letter-wrapper">
    <div class="letter-deco-top">🌸 💗 🌸</div>
    <div class="letter-salutation">Em yêu của anh,</div>
    <div class="letter-body" id="letterBody"><span class="cursor-blink" id="typeCursor"></span></div>
    <div class="letter-sign" id="letterSign">— Với tất cả tình yêu của anh 💗</div>
    <div class="letter-deco-bottom" id="letterDeco">🌸 &nbsp; 💕 &nbsp; 🌸</div>
    <button class="replay-btn" id="replayBtn" onclick="replayAll()">↺ &nbsp; Xem lại từ đầu</button>
  </div>
</div>

// ===== CONFETTI =====
const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
let confetti=[],animFrame,confettiSpawnInterval;
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
const colors=['#ff85b3','#ffb3d1','#ffd6e7','#ff6b9d','#f06292','#ffc4de','#e91e8c','#fff0f5','#ff94c2'];
function spawnConfetti(){for(let i=0;i<6;i++)confetti.push({x:Math.random()*canvas.width,y:-10,r:Math.random()*7+3,d:Math.random()*10+5,color:colors[Math.floor(Math.random()*colors.length)],tiltAngle:0,tiltSpeed:Math.random()*.1+.05,vx:Math.random()*2-1,vy:Math.random()*3+1.5,shape:Math.random()>.5?'circle':'rect',opacity:Math.random()*.5+.5})}
function drawConfetti(){ctx.clearRect(0,0,canvas.width,canvas.height);confetti.forEach(c=>{ctx.globalAlpha=c.opacity;ctx.fillStyle=c.color;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.tiltAngle);if(c.shape==='circle'){ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill()}else{ctx.fillRect(-c.r,-c.r/2,c.r*2,c.r)}ctx.restore()});ctx.globalAlpha=1}
function updateConfetti(){confetti=confetti.filter(c=>c.y<canvas.height+20);confetti.forEach(c=>{c.x+=c.vx+Math.sin(c.d)*.5;c.y+=c.vy;c.tiltAngle+=c.tiltSpeed;c.d+=.1})}
function startConfetti(){spawnConfetti();spawnConfetti();spawnConfetti();confettiSpawnInterval=setInterval(spawnConfetti,180);function loop(){animFrame=requestAnimationFrame(loop);updateConfetti();drawConfetti()}loop()}
function stopConfetti(){clearInterval(confettiSpawnInterval);setTimeout(()=>{cancelAnimationFrame(animFrame);ctx.clearRect(0,0,canvas.width,canvas.height)},2500)}

// ===== PETALS =====
function createPetals(id){const c=document.getElementById(id),pc=['#ffb3d1','#ffd6e7','#ff85b3','#ffc4de','#fff0f5','#f48fb1'];for(let i=0;i<18;i++){const p=document.createElement('div');p.className='petal';p.style.left=Math.random()*100+'%';p.style.top='-20px';p.style.background=pc[Math.floor(Math.random()*pc.length)];p.style.width=(Math.random()*10+6)+'px';p.style.height=(Math.random()*10+6)+'px';p.style.animationDuration=(Math.random()*10+10)+'s';p.style.animationDelay=(Math.random()*8)+'s';c.appendChild(p)}}
createPetals('petals1');createPetals('petals2');createPetals('petals3');

// ===== SLIDESHOW =====
let photos=[...embeddedPhotos];
let currentSlide=0,autoSlideTimer;

function buildSlides(){
  const stage=document.getElementById('photoStage');
  stage.innerHTML='';
  photos.forEach((p,i)=>{
    const div=document.createElement('div');div.className='photo-slide';
    const img=document.createElement('img');img.src=p.src;img.alt='Ảnh kỷ niệm';
    const ov=document.createElement('div');ov.className='sparkle-overlay';
    const cap=document.createElement('div');cap.className='photo-caption';cap.textContent=p.caption;
    div.appendChild(img);div.appendChild(ov);div.appendChild(cap);
    stage.appendChild(div);
  });
  currentSlide=0;
  document.querySelectorAll('.photo-slide')[0]?.classList.add('active');
  updateNav(1,photos.length);
}

function handlePhotos(input){
  const files=Array.from(input.files);if(!files.length)return;
  const captions=['Nụ cười của em là điều anh yêu nhất 💕','Cảm ơn em đã xuất hiện trong cuộc đời anh 🌹','Hai đứa mình — mãi mãi 💗','Em là nhà của anh 🏡','Bên em, mọi thứ đều đẹp hơn ✨','Hạnh phúc chính là đây 💖','Mãi yêu em thôi 🌸'];
  const readers=files.map((file,i)=>new Promise(res=>{const r=new FileReader();r.onload=e=>{photos.push({src:e.target.result,caption:captions[i%captions.length]});res()};r.readAsDataURL(file)}));
  Promise.all(readers).then(()=>buildSlides());
}

function changeSlide(dir){
  const slides=document.querySelectorAll('.photo-slide');if(slides.length<=1)return;
  const prev=slides[currentSlide];prev.classList.remove('active');prev.classList.add('prev');
  setTimeout(()=>prev.classList.remove('prev'),900);
  currentSlide=(currentSlide+dir+slides.length)%slides.length;
  slides[currentSlide].classList.add('active');
  updateNav(currentSlide+1,slides.length);
  spawnHeartBurst();
}

function updateNav(cur,total){
  document.getElementById('photoCount').textContent=cur+' / '+total;
  const dn=document.getElementById('dotNav');dn.innerHTML='';
  for(let i=0;i<total;i++){const d=document.createElement('div');d.className='dot'+(i===cur-1?' active':'');d.onclick=(idx=>()=>gotoSlide(idx))(i);dn.appendChild(d)}
}

function gotoSlide(idx){
  const slides=document.querySelectorAll('.photo-slide');if(idx===currentSlide)return;
  slides[currentSlide].classList.remove('active');slides[currentSlide].classList.add('prev');
  setTimeout(()=>slides[currentSlide]?.classList.remove('prev'),900);
  currentSlide=idx;slides[currentSlide].classList.add('active');
  updateNav(currentSlide+1,slides.length);
}

function startAutoSlide(){autoSlideTimer=setInterval(()=>changeSlide(1),4200)}
function stopAutoSlide(){clearInterval(autoSlideTimer)}
document.getElementById('photoStage').addEventListener('mouseenter',stopAutoSlide);
document.getElementById('photoStage').addEventListener('mouseleave',startAutoSlide);

// ===== TYPEWRITER =====
const message=`Một năm nữa được đón sinh nhật cùng em...

Hai năm thôi — nhưng trong hai năm đó, biết bao nhiêu điều đã thay đổi trong cuộc sống của chúng ta. Có những khoảnh khắc khó khăn, những lúc chông chênh, những lần cả hai cùng vấp ngã.

Nhưng với anh, điều may mắn nhất — là dù bao nhiêu thứ thay đổi, vẫn còn đó một điều không hề dịch chuyển: sự hiện diện của em trong cuộc đời anh, và của anh trong cuộc đời em.

Cảm ơn em vì những lần tha thứ khi anh chưa xứng đáng. Cảm ơn vì những lần nhường nhịn mà em không bao giờ kể lại. Cảm ơn vì đã ở lại — và tiếp tục ở lại.

Em không cần phải hoàn hảo. Anh cũng không. Nhưng khi có nhau, chúng ta đủ rồi.

Sinh nhật em, anh chỉ ước một điều thôi — rằng mỗi năm tiếp theo, anh sẽ là người được đứng cạnh em, được chứng kiến em lớn lên, được yêu em nhiều hơn ngày hôm qua.

Yêu em, hôm nay và mãi mãi. 💗`;

let typeIdx=0,typeTimer,isTyping=false;
function startTypewriter(){
  if(isTyping)return;isTyping=true;
  const body=document.getElementById('letterBody'),cursor=document.getElementById('typeCursor');
  body.innerHTML='';body.appendChild(cursor);typeIdx=0;spawnFloatingHearts();
  typeTimer=setInterval(()=>{
    if(typeIdx>=message.length){clearInterval(typeTimer);cursor.remove();
      document.getElementById('letterSign').classList.add('visible');
      document.getElementById('letterDeco').classList.add('visible');
      document.getElementById('replayBtn').classList.add('visible');return}
    const ch=message[typeIdx];
    if(ch==='\n'){body.insertBefore(document.createElement('br'),cursor);
      if(message[typeIdx+1]==='\n'){body.insertBefore(document.createElement('br'),cursor);typeIdx++}}
    else{const s=document.createElement('span');s.textContent=ch;body.insertBefore(s,cursor)}
    typeIdx++;
  },26);
}

// ===== HEARTS =====
function spawnHeartBurst(){
  const e=['💗','🌸','💕','🌷','💖'];
  for(let i=0;i<5;i++)setTimeout(()=>{
    const h=document.createElement('div');h.className='heart-float';
    h.textContent=e[Math.floor(Math.random()*e.length)];
    h.style.left=(Math.random()*80+10)+'%';h.style.bottom='10%';
    h.style.animationDuration=(Math.random()*2+3)+'s';
    h.style.fontSize=(Math.random()*14+14)+'px';
    document.body.appendChild(h);setTimeout(()=>h.remove(),5000);
  },i*200);
}
function spawnFloatingHearts(){const iv=setInterval(spawnHeartBurst,3000);setTimeout(()=>clearInterval(iv),28000)}

// ===== SCREENS =====
function goToScreen(n){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const t=document.getElementById('s'+n);t.classList.add('active');
  if(n===1){startConfetti();setTimeout(stopConfetti,7000)}
  else if(n===2){stopConfetti();setTimeout(startAutoSlide,800)}
  else if(n===3){stopAutoSlide();isTyping=false;
    document.getElementById('letterSign').classList.remove('visible');
    document.getElementById('letterDeco').classList.remove('visible');
    document.getElementById('replayBtn').classList.remove('visible');
    setTimeout(startTypewriter,600)}
}
function replayAll(){goToScreen(1)}

// INIT
buildSlides();
startConfetti();
setTimeout(stopConfetti,7000);
</script>
